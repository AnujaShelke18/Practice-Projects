<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 80px auto;
      padding: 0 16px;
      color: #222;
    }

    h1 {
      margin-bottom: 24px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .copy-btn {
      padding: 4px 10px;
      font-size: 14px;
      margin-left: 6px;
      color: #4f46e5;
      background: #e0e7ff;
    }

    .copy-btn:hover {
      background: #c7d2fe;
    }

    #result {
      margin-top: 24px;
      font-size: 18px;
    }

    #result a {
      color: #4f46e5;
      word-break: break-all;
    }

    #previousCodes {
      padding-left: 20px;
    }

    #previousCodes li {
      margin-bottom: 8px;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <h1>URL Shortener</h1>
  <div class="row">
    <input id="urlInput" type="text" placeholder="https://example.com">
    <button id="shortenBtn">Shorten</button>
  </div>
  <div id="result"></div>
  <h3>Recent links</h3>
  <ul id="previousCodes"></ul>

  <script>
    const input = document.getElementById("urlInput");
    const button = document.getElementById("shortenBtn");
    const result = document.getElementById("result");
    const historyList = document.getElementById("previousCodes");

    let previousCodes = JSON.parse(localStorage.getItem("previousCodes") || "[]");

    // Copies text to the clipboard and briefly changes the button label
    function copyText(text, btn) {
      navigator.clipboard.writeText(text)
        .then(() => {
          btn.textContent = "Copied!";
        })
        .catch(() => {
          btn.textContent = "Copy failed";
        })
        .finally(() => {
          setTimeout(() => {
            btn.textContent = "Copy";
          }, 1500);
        });
    }

    // Builds a small "Copy" button for a given short link
    function makeCopyButton(text) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy-btn";
      btn.textContent = "Copy";
      btn.addEventListener("click", () => copyText(text, btn));
      return btn;
    }

    function renderHistory() {
      historyList.innerHTML = "";
      for (const item of previousCodes) {
        const li = document.createElement("li");

        const a = document.createElement("a");
        const shortUrl = window.location.origin + "/" + item.shortCode;
        a.href = shortUrl;
        a.textContent = shortUrl;

        const span = document.createElement("span");
        span.textContent = " → " + item.originalUrl;

        li.append(a, makeCopyButton(shortUrl), span);
        historyList.append(li);
      }
    }

    renderHistory();

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Shortening...";
      result.textContent = "";

      try {
        const response = await fetch("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: input.value.trim() })
        });

        if (response.status === 400) {
          result.textContent = "Enter a full link starting with http:// or https://";
          return;
        }
        if (!response.ok) {
          result.textContent = "Server error (" + response.status + "). Please try again.";
          return;
        }

        const data = await response.json();

        previousCodes.unshift({ shortCode: data.shortCode, originalUrl: data.originalUrl });
        previousCodes = previousCodes.slice(0, 5);
        localStorage.setItem("previousCodes", JSON.stringify(previousCodes));
        renderHistory();

        const shortUrl = window.location.origin + "/" + data.shortCode;
        const link = document.createElement("a");
        link.href = shortUrl;
        link.textContent = shortUrl;
        result.append(link, makeCopyButton(shortUrl));
      } catch (error) {
        result.textContent = "Could not reach the server. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Shorten";
      }
    });
  </script>
</body>

</html>
